plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.alchembright.dev.langtrackapp'
    compileSdk 37
    defaultConfig {
        applicationId "com.alchembright.dev.langtrackapp"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 3
        versionName "1.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    flavorDimensions += "environment"
    productFlavors {
        dev {
            dimension "environment"
            applicationId "com.alchembright.kirokun.dev"
            buildConfigField "String", "API_BASE_URL", '"https://dev.kirokun.alchembright.com/api/"'
        }
        legacy {
            dimension "environment"
            buildConfigField "String", "API_BASE_URL", '""'
        }
        proto {
            dimension "environment"
            buildConfigField "String", "API_BASE_URL", '"https://proto.kirokun.alchembright.com/api/"'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    dataBinding {
        enabled = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.core:core-splashscreen:1.0.1'
    devImplementation 'androidx.credentials:credentials:1.3.0'
    devImplementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    devImplementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation "org.jetbrains.kotlin:kotlin-parcelize-runtime:2.2.10"
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'

    //RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'

    //Fuel + Gson
    implementation 'com.github.kittinunf.fuel:fuel:2.3.1' //Core package
    implementation 'com.github.kittinunf.fuel:fuel-android:2.3.1' //Android
    implementation 'com.github.kittinunf.fuel:fuel-gson:2.3.1' //Fuel Gson
    implementation 'com.google.code.gson:gson:2.13.2' //Gson


    //okHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
    androidComponents {
        onVariants(selector().withFlavor("environment", "dev").withBuildType("debug")) { variant ->
            variant.buildConfigFields.put("API_BASE_URL", new com.android.build.api.variant.BuildConfigField("String", '"http://localhost:18082/api/"', "SSH tunnel via adb reverse"))
        }
    }
