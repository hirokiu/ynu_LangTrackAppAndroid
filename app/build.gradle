plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.gms.google-services'
}

// Distribution credentials are provided locally, never committed to this repository.
def releaseKeys = ['KIROKUN_KEYSTORE', 'KIROKUN_KEY_ALIAS', 'KIROKUN_STORE_PASSWORD', 'KIROKUN_KEY_PASSWORD']
def releaseValues = releaseKeys.collectEntries { [(it): System.getenv(it)] }
def hasReleaseSigning = releaseValues.values().every { it }

android {
    namespace 'com.alchembright.dev.langtrackapp'
    compileSdk 37
    defaultConfig {
        applicationId "com.alchembright.dev.langtrackapp"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 5
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments notClass: "com.alchembright.dev.langtrackapp.ManualSurveyPreview"
    }
    flavorDimensions += "environment"
    productFlavors {
        dev {
            dimension "environment"
            applicationId "com.alchembright.kirokun.dev"
            buildConfigField "String", "API_BASE_URL", '"https://dev.kirokun.alchembright.com/api/"'
        }
        legacy {
            dimension "environment"
            buildConfigField "String", "API_BASE_URL", '""'
        }
        proto {
            dimension "environment"
            buildConfigField "String", "API_BASE_URL", '"https://proto.kirokun.alchembright.com/api/"'
        }
    }
    signingConfigs {
        distribution {
            if (hasReleaseSigning) {
                storeFile file(releaseValues.KIROKUN_KEYSTORE)
                storePassword releaseValues.KIROKUN_STORE_PASSWORD
                keyAlias releaseValues.KIROKUN_KEY_ALIAS
                keyPassword releaseValues.KIROKUN_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.distribution
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    dataBinding {
        enabled = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.core:core-splashscreen:1.0.1'
    devImplementation 'androidx.credentials:credentials:1.3.0'
    devImplementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    devImplementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation "org.jetbrains.kotlin:kotlin-parcelize-runtime:2.2.10"
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'

    //RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'

    //Fuel + Gson
    implementation 'com.github.kittinunf.fuel:fuel:2.3.1' //Core package
    implementation 'com.github.kittinunf.fuel:fuel-android:2.3.1' //Android
    implementation 'com.github.kittinunf.fuel:fuel-gson:2.3.1' //Fuel Gson
    implementation 'com.google.code.gson:gson:2.13.2' //Gson


    //okHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
    androidComponents {
        onVariants(selector().withFlavor("environment", "dev").withBuildType("debug")) { variant ->
            if (providers.gradleProperty("devLocalTunnel").orNull == "true") {
            variant.buildConfigFields.put("API_BASE_URL", new com.android.build.api.variant.BuildConfigField("String", '"http://localhost:18082/api/"', "SSH tunnel via adb reverse"))
            }
        }
    }

// Explicit release entry point refuses missing signing instead of falling back to debug.
tasks.register('verifyDistributionSigning') {
    doLast {
        if (!hasReleaseSigning) throw new GradleException('Set all KIROKUN_* signing environment variables; debug signing is not allowed for distribution.')
        if (!file(releaseValues.KIROKUN_KEYSTORE).isFile()) throw new GradleException('Distribution keystore was not found.')
    }
}
tasks.register('prepareProtoDistribution') {
    dependsOn 'verifyDistributionSigning', 'assembleProtoRelease'
}
tasks.matching { it.name == 'preProtoReleaseBuild' }.configureEach {
    if (gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'prepareProtoDistribution' }) {
        dependsOn 'verifyDistributionSigning'
    }
}
